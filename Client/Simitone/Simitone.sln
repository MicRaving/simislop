# Simitone.sln - THE GAME
# ============================================================================
# Two changes from the file this replaces, both from docs/AUDIT_BUILD_DEPS.md.
#
# C-11: Xamarin-era solution configurations pruned
# ================================================
# The old file declared 20 solution configurations - Ad-Hoc and AppStore across
# Any CPU / iPhone / iPhoneSimulator / x86 / x64 - for 24 SDK-style projects that
# only ever build Debug|Any CPU and Release|Any CPU. The Xamarin projects that
# wanted Ad-Hoc and AppStore (FSO.iOS, FSODroid) have not been in this solution for
# years and are packages.config-era projects that cannot build here at all (C-12).
# Roughly 620 of the old file's 1045 lines were the resulting ProjectConfigurationPlatforms
# entries, which is exactly the sort of noise that hides real state in a solution
# diff.
#
# The mappings were not merely redundant, they were wrong. For several projects
# "{guid}.Ad-Hoc|Any CPU.ActiveCfg = Release|Any CPU" and
# "{guid}.Ad-Hoc|x64.ActiveCfg = Ad-Hoc|Any CPU", so `dotnet build -c Debug -p:Platform=x64`
# - which the old solution accepted - mapped to a mixture of Debug|Any CPU and
# Ad-Hoc|Any CPU depending on the project. There is now no such configuration to
# select: `dotnet build -p:Platform=x64` fails immediately with MSB4126 naming the
# valid configurations, which is the correct outcome for a configuration nobody defined.
#
# B-12: the -ide host and the TSO server closure are out
# =====================================================
# FSO.Client (the TSO online client) ProjectReferences FSO.Server, FSO.Server.Database,
# FSO.Server.DataService, FSO.Server.Clients, FSO.Server.Protocol, FSO.Server.Updater
# and FSO.Server.Common, and FSO.IDE (the Volcanic IDE host) ProjectReferences FSO.Client,
# FSO.Windows and FSO.SimAntics.JIT.Roslyn. So one edge - Simitone.Windows -> FSO.IDE -
# used to reach 19 projects, 9 of which are the ones dropped from the list below. None
# of it survived into the game: TrimSingleplayerOutput in Simitone.Windows.csproj
# deletes server.dll, watchdog.*, FSO.Server.*, FSO.Common.DataService, MySql.Data,
# System.Data.SqlClient, System.Data.SQLite, AWSSDK.*, Octokit, RestSharp, JWT, crypto,
# NLog and the SSPI/GSSAPI/SQLite natives from $(OutDir) seconds after the build has
# spent ten minutes producing them. The audit measured 203 of 574 unique warnings -
# 35 % - in those projects.
#
# They are no longer listed here, and Simitone.Windows no longer references them
# (see the BuildIde comment block in Directory.Build.props). Both halves are needed:
# a solution builds every project in its project table whether or not anything
# references it, and a project reference is followed whether or not the target is
# listed. Dropping one without the other would have changed nothing.
#
# Consequence worth knowing before you file a bug: `dotnet msbuild <one of them>`,
# opening them in an IDE, and `-p:BuildIde=true` on this solution all still work. The
# projects have not been deleted and have not been edited; they are simply not part of
# the game build any more. To get an -ide-capable Simitone.exe:
#
#     dotnet build Client/Simitone/Simitone.sln -c Release -p:BuildIde=true
#
# which restores both references and rebuilds their closure. Add
# -p:TrimSingleplayerOutput=false to keep the TSO server assemblies in the output,
# which is what a Debug build already does.
#
# Simitone.GenerateMeshes and Simitone.PackageRemeshes are still absent from this file
# and still built, as build-only ProjectReferences of Simitone.Windows. That is
# unchanged and correct.
# ============================================================================
